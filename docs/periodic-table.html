        .dark .pt-head { color: #64748b; }

        .pt-cell {
            position: relative;
            aspect-ratio: 1 / 1;
            border-width: 1px;
            border-style: solid;
            border-radius: 8px;
            padding: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
        }
        .pt-cell:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.18); z-index: 5; }
        .pt-cell:active { transform: scale(.96); }
        .pt-cell.is-dim { opacity: .25; }
        .pt-cell.is-hi { outline: 2px solid #3b82f6; outline-offset: 1px; }

        .pt-name { width: 100%; font-size: 8px; line-height: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pt-label {

            for (const e of ELEMENTS) {
                const { col, row } = positionOf(e);
                const name = lang === 'zh' ? e.zh : e.en;
                html += `<button type="button" class="pt-cell ${CATEGORIES[e.cat].cls}" data-z="${e.z}" style="grid-column:${col};grid-row:${row}" title="${e.z} ${e.symbol} · ${e.zh} / ${e.en}">
                    <span class="pt-z">${e.z}</span>
                    <span class="pt-sym">${e.symbol}</span>
                    <span class="pt-name">${name}</span>
                </button>`;
            }

            // 主表中镧系/锕系的占位
            html += `<div class="pt-label" style="grid-column:3;grid-row:7">57–71</div>`;
            html += `<div class="pt-label" style="grid-column:3;grid-row:8">89–103</div>`;

            // 镧系/锕系行标签
            html += `<div class="pt-series pt-series-lan" style="grid-column:1 / span 2;grid-row:10">${L.series.lanthanide}</div>`;
            html += `<div class="pt-series pt-series-act" style="grid-column:1 / span 2;grid-row:11">${L.series.actinide}</div>`;

            grid.innerHTML = html;
            applyFilter();
        }

        function renderLegend() {
            const legend = document.getElementById('legend');
            legend.innerHTML = Object.entries(CATEGORIES).map(([key, c]) => `
                <button type="button" data-cat="${key}" class="legend-chip ${c.cls}">
                    <span class="dot"></span>${lang === 'zh' ? c.zh : c.en}
                </button>`).join('');
            legend.querySelectorAll('.legend-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    activeCat = (activeCat === chip.dataset.cat) ? null : chip.dataset.cat;
                    legend.querySelectorAll('.legend-chip').forEach(c => {
                        const on = c.dataset.cat === activeCat;
                        c.classList.toggle('is-active', on);
                        c.classList.toggle('is-dim', !!activeCat && !on);
                    });
                    applyFilter();
                });
            });
        }

        function applyFilter() {
            const q = searchInput.value.trim().toLowerCase();
            const filtering = !!q || !!activeCat;
            let n = 0;
            grid.querySelectorAll('.pt-cell').forEach(btn => {
                const e = BY_Z[+btn.dataset.z];
                const hay = `${e.z} ${e.symbol} ${e.zh} ${e.en}`.toLowerCase();
                const ok = (!q || hay.includes(q)) && (!activeCat || e.cat === activeCat);
                btn.classList.toggle('is-dim', !ok);
                btn.classList.toggle('is-hi', ok && filtering);
                if (ok) n++;
            });
            document.getElementById('count').textContent = t().countFn(n);
        }

        function applyI18nUI() {
            const L = t();
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.getElementById('t-title').textContent = L.title;
            document.getElementById('t-subtitle').textContent = L.subtitle;
            searchInput.placeholder = L.search;
        }

        /* ========== 6. 详情弹窗 ========== */
        const modal = document.getElementById('modal');

        function openDetail(z) {
            const e = BY_Z[z];
            const cat = CATEGORIES[e.cat];
            const L = t();

            const head = document.getElementById('modalHead');
            head.className = `p-5 flex items-center gap-4 border-b border-slate-100 dark:border-slate-800 ${cat.cls}`;
            document.getElementById('m-symbol').textContent = e.symbol;
            document.getElementById('m-z').textContent = e.z;
            document.getElementById('m-name').textContent = lang === 'zh' ? e.zh : e.en;
            document.getElementById('m-name2').textContent = lang === 'zh' ? e.en : e.zh;

            const rows = [
                [L.detail.number, e.z],
                [L.detail.symbol, e.symbol],
                [L.detail.name, `${e.zh} / ${e.en}`],
                [L.detail.mass, e.mass],
                [L.detail.category, cat[lang]],
                [L.detail.group, e.group],
                [L.detail.period, e.period],
                [L.detail.block, L.blocks[e.block] || e.block],
                [L.detail.phase, L.phases[e.phase] || e.phase]
            ];
            document.getElementById('m-body').innerHTML = rows.map(([k, v]) => `
                <div class="detail-row">
                    <span class="text-slate-500 dark:text-slate-400">${k}</span>
                    <span class="font-medium text-right">${v}</span>
                </div>`).join('');
            document.getElementById('closeBtn').textContent = L.close;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDetail() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        /* ========== 7. 事件绑定 ========== */
        grid.addEventListener('click', ev => {
            const btn = ev.target.closest('.pt-cell');
            if (btn) openDetail(+btn.dataset.z);
        });
        document.getElementById('closeBtn').addEventListener('click', closeDetail);
        modal.addEventListener('click', ev => { if (ev.target === modal) closeDetail(); });
        document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDetail(); });

        searchInput.addEventListener('input', applyFilter);

        // 无 URL 指定主题时，跟随系统主题变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!urlParams.get('theme')) {
                document.documentElement.classList.toggle('dark', e.matches);
            }
        });

        /* ========== 8. 初始化 ========== */
        applyI18nUI();
        renderLegend();
        renderGrid();
    </script>
</body>
</html>
