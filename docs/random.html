<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能随机生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
    <style>
        body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .input-style { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px; font-size: 14px; outline: none; }
        .input-style:focus { border-color: #4f46e5; ring: 1px; ring-color: #4f46e5; }
        .tab-btn { padding: 10px; cursor: pointer; border-bottom: 2px solid transparent; color: #6b7280; font-weight: 500; transition: all 0.2s; }
        .tab-active { border-bottom-color: #4f46e5; color: #4f46e5; }
        .btn-primary { background: #4f46e5; color: white; border-radius: 8px; font-weight: 600; transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
    </style>
</head>
<body class="py-10 px-4">
    <div class="max-w-5xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">RANDOM <span class="text-indigo-600">TOOL</span></h1>
            <p class="text-gray-500">专业级随机数、字符串及全版本 UUID 生成工具</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-2">
            <div class="lg:col-span-4 space-y-2">
                <div class="card overflow-hidden">
                    <div class="flex bg-gray-50">
                        <div onclick="switchTab('number')" id="tab-number" class="tab-btn flex-1 text-center tab-active">数值</div>
                        <div onclick="switchTab('string')" id="tab-string" class="tab-btn flex-1 text-center">字符串</div>
                        <div onclick="switchTab('uuid')" id="tab-uuid" class="tab-btn flex-1 text-center">UUID</div>
                    </div>
                    <div id="configContainer" class="p-6 min-h-[320px]">
                        </div>
                </div>

                <div class="card p-6 m-0">
                    <label class="block text-sm font-bold text-gray-700 mb-2">批量数量</label>
                    <input type="number" id="batchCount" value="10" min="1" max="5000" class="input-style">
                    <button onclick="handleGenerate()" class="w-full btn-primary mt-6 py-3 shadow-md">
                        生成数据
                    </button>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="card p-6 h-full flex flex-col min-h-[550px]">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest">Output</h2>
                        <button onclick="copyResults()" id="copyBtn" class="text-indigo-600 text-sm font-bold flex items-center gap-1 hover:bg-indigo-50 px-2 py-1 rounded">
                            复制全部
                        </button>
                    </div>
                    <textarea id="output" readonly class="w-full flex-1 p-4 bg-gray-50 border border-gray-200 rounded-lg font-mono text-sm leading-relaxed text-gray-700 focus:outline-none resize-none" placeholder="等待生成..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'number';
        // 标准 UUID Namespace (DNS)
        const NAMESPACE_DNS = uuid.v4();

        const templates = {
            number: `
                <h3 class="font-bold text-gray-800 mb-4">数值范围</h3>
                <div class="space-y-4">
                    <div><label class="text-xs text-gray-400 block mb-1">最小值</label><input type="number" id="numMin" value="0" class="input-style"></div>
                    <div><label class="text-xs text-gray-400 block mb-1">最大值</label><input type="number" id="numMax" value="100" class="input-style"></div>
                    <div><label class="text-xs text-gray-400 block mb-1">小数位数</label><input type="number" id="numDecimals" value="0" class="input-style"></div>
                </div>`,
            string: `
                <h3 class="font-bold text-gray-800 mb-4">字符串规则</h3>
                <div class="space-y-4">
                    <div><label class="text-xs text-gray-400 block mb-1">字符长度</label><input type="number" id="strLen" value="16" class="input-style"></div>
                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <label class="flex items-center text-sm"><input type="checkbox" id="incUpper" checked class="mr-2 rounded"> A-Z</label>
                        <label class="flex items-center text-sm"><input type="checkbox" id="incLower" checked class="mr-2 rounded"> a-z</label>
                        <label class="flex items-center text-sm"><input type="checkbox" id="incNum" checked class="mr-2 rounded"> 0-9</label>
                        <label class="flex items-center text-sm"><input type="checkbox" id="incSpec" class="mr-2 rounded"> 特殊符</label>
                    </div>
                </div>`,
            uuid: `
                <h3 class="font-bold text-gray-800 mb-4">UUID 标准</h3>
                <div class="space-y-3">
                    <label class="flex items-center text-sm"><input type="radio" name="uVer" value="v4" checked onchange="toggleUConfig(false)" class="mr-2"> V4 (基于随机数)</label>
                    <label class="flex items-center text-sm"><input type="radio" name="uVer" value="v1" onchange="toggleUConfig(false)" class="mr-2"> V1 (基于时间/网卡)</label>
                    <label class="flex items-center text-sm"><input type="radio" name="uVer" value="v3" onchange="toggleUConfig(true)" class="mr-2"> V3 (基于 MD5)</label>
                    <label class="flex items-center text-sm mb-2"><input type="radio" name="uVer" value="v5" onchange="toggleUConfig(true)" class="mr-2"> V5 (基于 SHA-1)</label>
                    <div id="uExtended" class="hidden space-y-2 mt-2">
                        <input type="text" id="uNamespace" value="${NAMESPACE_DNS}" placeholder="Namespace (UUID 格式)" class="input-style text-xs">
                        <input type="text" id="uName" placeholder="Name (输入字符串)" class="input-style text-xs">
                    </div>
                </div>`
        };

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('tab-active'));
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            document.getElementById('configContainer').innerHTML = templates[tab];
        }

        function toggleUConfig(show) {
            const ext = document.getElementById('uExtended');
            ext.style.display = show ? 'block' : 'none';
        }

        function handleGenerate() {
            const count = parseInt(document.getElementById('batchCount').value) || 1;
            const output = document.getElementById('output');
            let results = [];

            try {
                for (let i = 0; i < count; i++) {
                    if (currentTab === 'number') {
                        const min = parseFloat(document.getElementById('numMin').value);
                        const max = parseFloat(document.getElementById('numMax').value);
                        const dec = parseInt(document.getElementById('numDecimals').value);
                        results.push((Math.random() * (max - min) + min).toFixed(dec));
                    } 
                    else if (currentTab === 'string') {
                        const len = parseInt(document.getElementById('strLen').value);
                        let charset = "";
                        if (document.getElementById('incUpper').checked) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                        if (document.getElementById('incLower').checked) charset += "abcdefghijklmnopqrstuvwxyz";
                        if (document.getElementById('incNum').checked) charset += "0123456789";
                        if (document.getElementById('incSpec').checked) charset += "!@#$%^&*()_+";
                        if (!charset) charset = "abcdefghijklmnopqrstuvwxyz";
                        let s = "";
                        for (let j = 0; j < len; j++) s += charset.charAt(Math.floor(Math.random() * charset.length));
                        results.push(s);
                    } 
                    else if (currentTab === 'uuid') {
                        const ver = document.querySelector('input[name="uVer"]:checked').value;
                        if (ver === 'v1') results.push(uuid.v1());
                        else if (ver === 'v4') results.push(uuid.v4());
                        else {
                            const ns = document.getElementById('uNamespace').value;
                            const name = document.getElementById('uName').value || "example";
                            // 校验 ns 是否是合法 UUID
                            if (ver === 'v3') results.push(uuid.v3(name, ns));
                            if (ver === 'v5') results.push(uuid.v5(name, ns));
                        }
                    }
                }
                output.value = results.join('\n');
            } catch (err) {
                output.value = "错误: " + err.message + "\n\n提示: V3/V5 的 Namespace 必须是一个有效的 UUID 格式字符串。";
            }
        }

        function copyResults() {
            const area = document.getElementById('output');
            if (!area.value) return;
            area.select();
            document.execCommand('copy');
            const btn = document.getElementById('copyBtn');
            const original = btn.innerText;
            btn.innerText = "✅ 已复制";
            setTimeout(() => btn.innerText = original, 2000);
        }

        // 初始化
        switchTab('number');
    </script>
</body>
</html>
