<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 作品集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 backdrop-blur-md bg-white/80">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-100">
                    <i class="fa-solid fa-toolbox text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">AI 作品集</h1>
                    <p class="text-xs text-slate-500">AI 生成的各种单页应用</p>
                </div>
            </div>
            
            <div class="relative w-full sm:w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="searchInput" oninput="handleSearch()" 
                       class="w-full pl-9 pr-4 py-2 bg-slate-100 border border-transparent rounded-xl text-sm focus:outline-none focus:bg-white focus:border-indigo-500 transition-all" 
                       placeholder="搜索...">
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
        <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <div id="noResults" class="hidden text-center py-12 text-slate-400">
            <i class="fa-regular fa-folder-open text-4xl mb-3 block"></i>
            <p>没有找到相关的页面</p>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400">
        <p>© 2026 <a href="https://xplanc.org/" target="_blank" class="underline text-sky-500">PlanC</a> 的 AI 玩具箱.</p>
        <p>Built with Pure Love.</p>
    </footer>

    <script>
        const iconColors = ["text-sky-500", "text-violet-500", "text-amber-500", "text-rose-500", "text-emerald-500"]
        const iconBgColors = ["bg-sky-50", "bg-violet-50", "bg-amber-50", "bg-rose-50", "bg-emerald-50"]

        const toolsData = [
            {
                title: "四则运算·练习",
                desc: "随机生成若干 100 以内的四则运算练习题，限时完成答题。",
                icon: "fa-calculator",
                link: "arithmetic.html"
            },

            {
                title: "Base32/Base64 · 编解码",
                desc: "节流互转，双向实时操作。",
                icon: "fa-b",
                link: "base32-64.html"
            },

            {
                title: "压缩包 · 伪装",
                desc: "将压缩包无缝隐藏在图片中。",
                icon: "fa-file-zipper",
                link: "compression-image.html"
            },

            {
                title: "cURL · 命令生成",
                desc: "可视化配置生成 cURL 命令。",
                icon: "fa-terminal",
                link: "curl.html"
            },

            {
                title: "表情包 · 裁剪分割",
                desc: "手动调整边缘裁剪值去除空白边距，然后按网格进行拆分。",
                icon: "fa-scissors",
                link: "cut-6x4.html"
            },

            {
                title: "课程表 · 制作/打印",
                desc: "将课程拖入单元格，也可以点击单元格直接编辑。",
                icon: "fa-table",
                link: "drag-class.html"
            },

            {
                title: "画图",
                desc: "适合从简单涂鸦到复杂几何绘制的各种场景，既可作为教学演示，也可用于日常快速绘图需求。",
                icon: "fa-palette",
                link: "draw.html"
            },

            {
                title: "哈希 · 计算器",
                desc: "计算各种哈希值，支持文本或文件输入。",
                icon: "fa-key",
                link: "hash.html"
            },

            {
                title: "赛博 · 烧纸钱",
                desc: "在线祭祀，寄托哀思。",
                icon: "fa-money-bill",
                link: "joss_paper.html"
            },

            {
                title: "五子棋 · AI",
                desc: "博弈树的 AI 五子棋游戏。",
                icon: "fa-circle-half-stroke",
                link: "five-in-a-row.html"
            },

            {
                title: "Linux 命令 · 速查",
                desc: "输入 Linux 命令，快速跳转到中文文档。",
                icon: "fa-terminal",
                link: "linux-cmd.html"
            },

            {
                title: "火星文 · 转换",
                desc: "火星文双向转换。",
                icon: "fa-arrow-right-arrow-left",
                link: "mars-converter.html"
            },

            {
                title: "节拍器",
                desc: "一个简单实用的音乐练习工具，它能够产生稳定的节拍声音，帮助音乐学习者保持准确的节奏感。",
                icon: "fa-drum",
                link: "metronome.html"
            },

            {
                title: "扫雷",
                desc: "如果你成功找出了所有地雷，并翻开所有非雷格子，即为胜利。",
                icon: "fa-bomb",
                link: "mine-sweeper.html"
            },

            {
                title: "幻影图片",
                desc: "白色背景下是一副图片，黑色背景下是另一幅图片",
                icon: "fa-eye",
                link: "mirage-image.html"
            },

            {
                title: "PDF 拼接",
                desc: "将多个 PDF 文件合并成一个文档，同时合并书签。",
                icon: "fa-file-pdf",
                link: "pdf-merge.html"
            },

            {
                title: "PDF 拆分",
                desc: "将 PDF 文档按指定的页数拆分成多个文档，同时拆分书签。",
                icon: "fa-file-pdf",
                link: "pdf-split.html"
            },

            {
                title: "PDF 转图片",
                desc: "将 PDF 文档按页拆分，转换为 PNG 图片。",
                icon: "fa-file-pdf",
                link: "pdf-to-png.html"
            },

            {
                title: "PDF 浏览",
                desc: "流式渲染大型 PDF 文件。",
                icon: "fa-file-pdf",
                link: "pdf-view.html"
            },

            {
                title: "二维码 · 生成/解析",
                desc: "二维码实时生成 · 上传识别。",
                icon: "fa-qrcode",
                link: "qrcode.html"
            },

            {
                title: "赛车 · 躲开车流",
                desc: "操纵汽车躲开车辆，尽可能开得更远。",
                icon: "fa-car-burst",
                link: "race.html"
            },

            {
                title: "随机数 · 生成",
                desc: "生成随机的数值、字符串或 UUID。",
                icon: "fa-shuffle",
                link: "random.html"
            },

            {
                title: "工资计算器",
                desc: "计算税后工资、和各项缴费。",
                icon: "fa-money-bill-wave",
                link: "salary.html"
            },

            {
                title: "舒尔特表格 · 测试",
                desc: "通过快速识别数字来测试注意力和反应速度。",
                icon: "fa-table-cells",
                link: "schulte-grid.html"
            },

            {
                title: "贪吃蛇",
                desc: "控制蛇吃到食物，每吃到一个食物蛇身就会变长，小心不要撞到墙壁或自己的身体。",
                icon: "fa-gamepad",
                link: "snake.html"
            },

            {
                title: "俄罗斯方块",
                desc: "使用方向键移动和旋转方块，空格键快速下落，看看你能得多少分。",
                icon: "fa-gamepad",
                link: "tetris.html"
            },

            {
                title: "艺术字 · 图片生成",
                desc: "多图层艺术字生成器。",
                icon: "fa-xmarks-lines",
                link: "text-img.html"
            },

            {
                title: "验证码 · 生成",
                desc: "生成随机或指定内容的图形验证码。",
                icon: "fa-check",
                link: "verification-code.html"
            },
        ];

        // 2. 渲染函数：负责把数组数据变成 HTML 并塞入页面
        function renderTools(tools) {
            const grid = document.getElementById('toolsGrid');
            const noResults = document.getElementById('noResults');

            // 如果没有数据，显示提示，清空列表
            if (tools.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            // 隐藏无结果提示
            noResults.classList.add('hidden');

            // 遍历数组生成 HTML 字符串
            const htmlString = tools.map((tool, i) => `
                <div class="bg-white p-6 rounded-2xl border border-slate-150 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between">
                    <div>
                        <div class="${iconColors[i%iconColors.length]} text-2xl mb-4 ${iconBgColors[i%iconBgColors.length]} w-12 h-12 rounded-xl flex items-center justify-center">
                            <i class="fa-solid ${tool.icon}"></i>
                        </div>
                        <h3 class="text-base font-semibold mb-2">${tool.title}</h3>
                        <p class="text-sm text-slate-500 line-clamp-2">${tool.desc}</p>
                    </div>
                    <a href="${tool.link}" class="mt-6 inline-flex items-center justify-center gap-2 text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-xl transition-colors">
                        打开 <i class="fa-solid fa-arrow-right text-xs"></i>
                    </a>
                </div>
            `).join('');

            // 渲染到页面中
            grid.innerHTML = htmlString;
        }

        // 3. 搜索处理函数：过滤数据并触发重新渲染
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            // 过滤数组中标题或描述包含关键字的
            const filteredTools = toolsData.filter(tool => 
                tool.title.toLowerCase().includes(query) || 
                tool.desc.toLowerCase().includes(query)
            );

            // 重新渲染过滤后的结果
            renderTools(filteredTools);
        }

        // 4. 页面首次加载时，自动执行一次渲染
        window.addEventListener('DOMContentLoaded', () => {
            renderTools(toolsData);
        });
    </script>
</body>
</html>
