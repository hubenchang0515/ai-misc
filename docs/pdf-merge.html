<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merge Tool</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --accent: #10b981;
        }

        /* 浅色模式变量 */
        .theme-light {
            --bg: #f8fafc;
            --container-bg: #ffffff;
            --text-main: #334155;
            --text-sub: #64748b;
            --drop-bg: #f1f5f9;
            --drop-border: #cbd5e1;
            --item-bg: #ffffff;
            --item-border: #e2e8f0;
            --log-bg: #1e293b;
            --log-text: #94fbab;
        }

        /* 深色模式变量 */
        .theme-dark {
            --bg: #0f172a;
            --container-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --drop-bg: #334155;
            --drop-border: #475569;
            --item-bg: #1e293b;
            --item-border: #334155;
            --log-bg: #020617;
            --log-text: #4ade80;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        .drop-zone { 
            border: 2px dashed var(--drop-border);
            padding: 30px;
            text-align: center;
            border-radius: 12px; 
            cursor: pointer;
            background: var(--drop-bg);
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .drop-zone.dragover { border-color: var(--primary); background: rgba(37, 99, 235, 0.1); }

        .file-list { margin-bottom: 20px; border: 1px solid var(--item-border); border-radius: 8px; }
        .file-item { 
            padding: 12px 15px;
            background: var(--item-bg);
            border-bottom: 1px solid var(--item-border);
            display: flex; align-items: center; justify-content: space-between;
            cursor: grab;
        }
        .file-item.dragging { opacity: 0.5; background: rgba(37, 99, 235, 0.05); }
        .file-item:last-child { border-bottom: none; }
        
        .file-info { display: flex; align-items: center; gap: 10px; flex-grow: 1; pointer-events: none; }
        .file-index { background: var(--drop-border); border-radius: 4px; padding: 2px 8px; font-size: 12px; color: var(--text-main); }
        
        .file-ops { display: flex; gap: 5px; pointer-events: auto; }
        .btn-sm { 
            padding: 4px 8px; font-size: 12px;
            border: 1px solid var(--drop-border);
            background: var(--item-bg);
            color: var(--text-main);
            border-radius: 4px; cursor: pointer; 
        }
        .btn-sm:hover { background: var(--drop-bg); border-color: var(--primary); }

        #mergeBtn { 
            width: 100%; background: var(--accent); color: white; border: none; 
            padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;
        }
        #mergeBtn:disabled { background: #94a3b8; cursor: not-allowed; }

        .log-container { 
            background: var(--log-bg); color: var(--log-text); padding: 15px; border-radius: 8px; 
            height: 180px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: 20px; 
        }
    </style>
</head>
<body class="theme-light">

<div class="container">
    <h2 style="margin-top:0"><span id="t-title">PDF 智能拼接</span> <small id="t-subtitle" style="font-weight:normal; font-size:14px; color:var(--text-sub)">支持拖拽文件排序</small></h2>
    
    <div class="drop-zone" id="dropZone">
        <p id="t-drop-text">拖拽多个 PDF 至此 (自动按名称排序) 或 <b>点击上传</b></p>
        <input type="file" id="fileInput" multiple accept=".pdf" style="display:none">
    </div>

    <div id="fileList" class="file-list"></div>

    <button id="mergeBtn" onclick="executeMerge()">合并 PDF 并重构书签</button>

    <div class="log-container" id="logBox"></div>
</div>

<script>
    const { PDFDocument, PDFName, PDFString, PDFNumber, PDFArray, PDFHexString } = PDFLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // --- 1. 多语言与主题配置 ---
    const i18n = {
        zh: {
            title: "PDF 智能拼接",
            subtitle: "支持拖拽文件排序",
            drop: "拖拽多个 PDF 至此 (自动按名称排序) 或 <b>点击上传</b>",
            btnMerge: "合并 PDF 并重构书签",
            ready: "准备就绪。请添加 PDF 文件。",
            addCount: "添加了 {count} 个文件并已按名称预排序",
            start: "正在启动合并流程...",
            reading: "正在读取: ",
            merging: "合并完成。正在重构 {count} 个书签节点...",
            done: "✅ 任务圆满完成！",
            error: "❌ 错误: ",
            minFiles: "请至少添加两个 PDF 进行合并"
        },
        en: {
            title: "Smart PDF Merge",
            subtitle: "Drag & Drop sorting supported",
            drop: "Drop multiple PDFs here (Auto-sorted by name) or <b>Click to upload</b>",
            btnMerge: "Merge PDFs & Reconstruct Bookmarks",
            ready: "Ready. Please add PDF files.",
            addCount: "Added {count} files, pre-sorted by name",
            start: "Starting merge process...",
            reading: "Reading: ",
            merging: "Merge complete. Reconstructing {count} bookmark nodes...",
            done: "✅ Task completed successfully!",
            error: "❌ Error: ",
            minFiles: "Please add at least two PDF files to merge"
        }
    };

    // 参数与系统检测
    const params = new URLSearchParams(window.location.search);
    let lang = params.get('language');
    if (lang !== 'zh' && lang !== 'en') {
        lang = navigator.language.startsWith('zh') ? 'zh' : 'en';
    }
    const t = i18n[lang];

    let theme = params.get('theme');
    if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    // 应用 UI
    document.body.className = `theme-${theme}`;
    document.getElementById('t-title').innerText = t.title;
    document.getElementById('t-subtitle').innerText = t.subtitle;
    document.getElementById('t-drop-text').innerHTML = t.drop;
    document.getElementById('mergeBtn').innerText = t.btnMerge;

    const logBox = document.getElementById('logBox');
    logBox.innerText = t.ready;

    // --- 2. 原有逻辑适配 ---
    let selectedFiles = [];
    const fileListEl = document.getElementById('fileList');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(n => {
        dropZone.addEventListener(n, e => { e.preventDefault(); e.stopPropagation(); });
    });
    dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        dropZone.classList.remove('dragover');
        handleNewFiles(Array.from(e.dataTransfer.files));
    });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => handleNewFiles(Array.from(fileInput.files)));

    function handleNewFiles(files) {
        const pdfs = files.filter(f => f.type === "application/pdf");
        pdfs.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
        selectedFiles = [...selectedFiles, ...pdfs];
        renderList();
        addLog(t.addCount.replace('{count}', pdfs.length));
    }

    function renderList() {
        fileListEl.innerHTML = '';
        selectedFiles.forEach((file, index) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.draggable = true;
            item.dataset.index = index;
            item.innerHTML = `
                <div class="file-info">
                    <span class="file-index">${index + 1}</span>
                    <span>${file.name}</span>
                </div>
                <div class="file-ops">
                    <button class="btn-sm" onclick="move(${index}, -1)">↑</button>
                    <button class="btn-sm" onclick="move(${index}, 1)">↓</button>
                    <button class="btn-sm" style="color:#ef4444" onclick="removeFile(${index})">✕</button>
                </div>
            `;
            item.addEventListener('dragstart', (e) => {
                e.target.classList.add('dragging');
                e.dataTransfer.setData('text/plain', index);
            });
            item.addEventListener('dragend', (e) => e.target.classList.remove('dragging'));
            fileListEl.appendChild(item);
        });
    }

    fileListEl.addEventListener('dragover', e => {
        e.preventDefault();
        const afterElement = getDragAfterElement(fileListEl, e.clientY);
        const dragging = document.querySelector('.dragging');
        if (afterElement == null) {
            fileListEl.appendChild(dragging);
        } else {
            fileListEl.insertBefore(dragging, afterElement);
        }
    });

    fileListEl.addEventListener('drop', e => {
        e.preventDefault();
        const items = Array.from(fileListEl.querySelectorAll('.file-item'));
        selectedFiles = items.map(item => selectedFiles[parseInt(item.dataset.index)]);
        renderList();
    });

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.file-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    window.move = (index, dir) => {
        const newIndex = index + dir;
        if (newIndex >= 0 && newIndex < selectedFiles.length) {
            [selectedFiles[index], selectedFiles[newIndex]] = [selectedFiles[newIndex], selectedFiles[index]];
            renderList();
        }
    };

    window.removeFile = (index) => {
        selectedFiles.splice(index, 1);
        renderList();
    };

    function addLog(msg) {
        const d = document.createElement('div');
        d.innerText = `> ${msg}`;
        logBox.appendChild(d);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function longestCommonPrefix(strs) {
        if (!strs || strs.length === 0) return "";
        if (strs.length === 1) return strs[0];
        for (let i = 0; i < strs[0].length; i++) {
            const char = strs[0][i];
            for (let j = 1; j < strs.length; j++) {
                if (i >= strs[j].length || strs[j][i] !== char) return strs[0].substring(0, i);
            }
        }
        return strs[0];
    }

    // --- 3. 核心合并逻辑 ---
    async function executeMerge() {
        if (selectedFiles.length < 2) return alert(t.minFiles);
        const btn = document.getElementById('mergeBtn');
        btn.disabled = true;
        logBox.innerHTML = '';
        addLog(t.start);

        try {
            const mergedDoc = await PDFDocument.create();
            let totalPageOffset = 0;
            const combinedOutlines = [];

            for (const file of selectedFiles) {
                addLog(`${t.reading}${file.name}`);
                const data = await file.arrayBuffer();
                const rawOutline = await fetchOutlineData(data);
                combinedOutlines.push(...shiftOutlinePages(rawOutline, totalPageOffset));
                const srcDoc = await PDFDocument.load(data);
                const pages = await mergedDoc.copyPages(srcDoc, srcDoc.getPageIndices());
                pages.forEach(p => mergedDoc.addPage(p));
                totalPageOffset += srcDoc.getPageCount();
            }

            if (combinedOutlines.length > 0) {
                addLog(t.merging.replace('{count}', combinedOutlines.length));
                const pageRefs = mergedDoc.getPages().map(p => p.ref);
                const pages = mergedDoc.getPages();
                injectOutlines(mergedDoc, combinedOutlines, pageRefs, pages);
            }

            const prefix = longestCommonPrefix(selectedFiles.flatMap(f => f.name)).replace(/[\W_]+$/, "");
            const finalName = (prefix || "Merged_PDF") + ".pdf";
            
            const bytes = await mergedDoc.save();
            const blob = new Blob([bytes], { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = finalName;
            link.click();
            addLog(t.done);

        } catch (e) {
            addLog(`${t.error}${e.message}`);
        } finally {
            btn.disabled = false;
        }
    }

    async function fetchOutlineData(data) {
        const doc = await pdfjsLib.getDocument({ data: new Uint8Array(data) }).promise;
        const outline = await doc.getOutline();
        if (!outline) return [];
        async function traverse(items) {
            const res = [];
            for (const item of items) {
                let pIdx = -1;
                try {
                    if (item.dest) {
                        const d = typeof item.dest === 'string' ? await doc.getDestination(item.dest) : item.dest;
                        pIdx = await doc.getPageIndex(d[0]);
                    }
                } catch(e){}
                res.push({ title: item.title, pageIdx: pIdx, children: item.items ? await traverse(item.items) : [] });
            }
            return res;
        }
        return traverse(outline);
    }

    function shiftOutlinePages(items, offset) {
        return items.map(i => ({
            ...i,
            pageIdx: i.pageIdx !== -1 ? i.pageIdx + offset : -1,
            children: shiftOutlinePages(i.children, offset)
        }));
    }

    function injectOutlines(pdfDoc, outlineData, pageRefs, pages) {
        const context = pdfDoc.context;
        const rootDict = context.obj({ Type: PDFName.of('Outlines'), Count: PDFNumber.of(countTotalNodes(outlineData)) });
        const rootRef = context.register(rootDict);

        function createTree(items, parentRef) {
            let first, last, prev;
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const dict = context.obj({ Title: PDFHexString.fromText(item.title), Parent: parentRef });
                if (item.pageIdx >= 0 && item.pageIdx < pageRefs.length) {
                    const h = pages[item.pageIdx].getSize().height;
                    const dest = PDFArray.withContext(context);
                    dest.push(pageRefs[item.pageIdx]);
                    dest.push(PDFName.of('XYZ'));
                    dest.push(PDFNumber.of(0)); 
                    dest.push(PDFNumber.of(h));
                    dest.push(PDFNumber.of(0));
                    dict.set(PDFName.of('Dest'), dest);
                }
                const ref = context.register(dict);
                if (i === 0) first = ref;
                last = ref;
                if (prev) {
                    context.lookup(prev).set(PDFName.of('Next'), ref);
                    dict.set(PDFName.of('Prev'), prev);
                }
                if (item.children.length > 0) {
                    const child = createTree(item.children, ref);
                    dict.set(PDFName.of('First'), child.first);
                    dict.set(PDFName.of('Last'), child.last);
                    dict.set(PDFName.of('Count'), PDFNumber.of(countTotalNodes(item.children)));
                }
                prev = ref;
            }
            return { first, last };
        }
        const res = createTree(outlineData, rootRef);
        rootDict.set(PDFName.of('First'), res.first);
        rootDict.set(PDFName.of('Last'), res.last);
        pdfDoc.catalog.set(PDFName.of('Outlines'), rootRef);
    }

    function countTotalNodes(items) {
        let c = items.length;
        items.forEach(i => c += countTotalNodes(i.children));
        return c;
    }
</script>
</body>
</html>
