<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">cURL 生成器</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --code-bg: #1e293b;
            --code-text: #f8fafc;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        [data-theme="dark"] {
            --primary: #60a5fa;
            --primary-hover: #3b82f6;
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --code-bg: #000000;
            --code-text: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, border-color 0.3s;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .flex-1 {
            flex: 1;
        }

        /* 调整向下箭头 */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-down" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/></svg>');
            background-repeat: no-repeat;
            background-position: right 0.75rem center; 
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.8rem;
            outline: none;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        .header-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.danger {
            background-color: var(--danger);
        }
        
        button.danger:hover {
            background-color: var(--danger-hover);
        }

        .icon-btn {
            padding: 0.75rem;
            height: 100%;
        }

        .checkbox-group {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            padding: 0.5rem 0;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: normal;
            cursor: pointer;
        }

        .output-container {
            margin-top: 2rem;
            position: relative;
        }

        pre {
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .copy-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h1 data-i18n="title">cURL 生成器</h1>

    <div class="row form-group">
        <div>
            <label data-i18n="method">请求方法</label>
            <select id="method">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="PATCH">PATCH</option>
                <option value="DELETE">DELETE</option>
                <option value="HEAD">HEAD</option>
                <option value="OPTIONS">OPTIONS</option>
            </select>
        </div>
        <div class="flex-1">
            <label data-i18n="url">请求地址 (URL)</label>
            <input type="text" id="url" placeholder="https://api.example.com/v1/data">
        </div>
    </div>

    <div class="row form-group">
        <div class="flex-1">
            <label data-i18n="userAgent">User-Agent (-A)</label>
            <input type="text" id="user-agent" placeholder="Mozilla/5.0...">
        </div>
        <div class="flex-1">
            <label data-i18n="proxy">代理服务器 (-x)</label>
            <input type="text" id="proxy" placeholder="http://127.0.0.1:8080">
        </div>
    </div>

    <div class="row form-group">
        <div class="flex-1">
            <label data-i18n="uploadFile">上传文件路径 (-T)</label>
            <input type="text" id="upload-file" placeholder="./input.json">
        </div>
        <div class="flex-1">
            <label data-i18n="outputFile">输出文件路径 (-T)</label>
            <input type="text" id="output-file" placeholder="./output.json">
        </div>
    </div>

    <div class="form-group">
        <label data-i18n="headers">请求头 (Headers)</label>
        <div id="headers-container"></div>
        <button type="button" id="add-header-btn" style="margin-top: 0.5rem;">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <div class="form-group">
        <label data-i18n="body">请求体 (Body - 针对 POST/PUT)</label>
        <textarea id="body" placeholder='{"key": "value"}'></textarea>
    </div>

    <div class="form-group">
        <label data-i18n="flags">行为选项</label>
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="flag-location"> <span data-i18n="followRedirect">跟随重定向 (-L)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="flag-insecure"> <span data-i18n="insecure">忽略 SSL 证书 (-k)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="flag-verbose"> <span data-i18n="verbose">详细输出 (-v)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="flag-silent"> <span data-i18n="silent">静默模式 (-s)</span>
            </label>
        </div>
    </div>

    <div class="form-group">
        <label data-i18n="customOptions">自定义参数 (支持其余所有 cURL 选项)</label>
        <input type="text" id="custom-options" placeholder="-u user:pass --connect-timeout 10">
    </div>

    <div class="output-container">
        <button class="copy-btn" id="copy-btn" data-i18n="copy">复制</button>
        <pre><code id="output">curl ...</code></pre>
    </div>
</div>

<script>
    // 国际化字典
    const i18n = {
        zh: {
            title: "cURL 命令可视化生成器",
            method: "请求方法",
            url: "请求地址 (URL)",
            userAgent: "User-Agent (-A)",
            proxy: "代理服务器 (-x)",
            uploadFile: "上传文件路径 (-T)",
            outputFile: "输出文件路径 (-o)",
            headers: "请求头 (Headers)",
            addHeader: "添加 Header",
            headerKey: "键 (如 Content-Type)",
            headerValue: "值 (如 application/json)",
            body: "请求体 (Body)",
            flags: "行为选项",
            followRedirect: "跟随重定向 (-L)",
            insecure: "忽略 SSL 证书 (-k)",
            verbose: "详细输出 (-v)",
            silent: "静默模式 (-s)",
            customOptions: "自定义参数 (支持其余所有 cURL 选项)",
            copy: "复制命令",
            copied: "已复制!"
        },
        en: {
            title: "Visual cURL Generator",
            method: "Method",
            url: "Request URL",
            userAgent: "User-Agent (-A)",
            proxy: "Proxy (-x)",
            uploadFile: "Upload File Path (-T)",
            outputFile: "Output Fule Path (-o)",
            headers: "Headers",
            addHeader: "Add Header",
            headerKey: "Key (e.g. Content-Type)",
            headerValue: "Value (e.g. application/json)",
            body: "Request Body",
            flags: "Behavior Flags",
            followRedirect: "Follow Redirects (-L)",
            insecure: "Insecure SSL (-k)",
            verbose: "Verbose (-v)",
            silent: "Silent (-s)",
            customOptions: "Custom Options (Supports all other cURL flags)",
            copy: "Copy",
            copied: "Copied!"
        }
    };

    // 系统配置解析
    const params = new URLSearchParams(window.location.search);
    
    // 语言逻辑
    let lang = params.get('language');
    if (lang !== 'zh' && lang !== 'en') {
        const sysLang = navigator.language || navigator.userLanguage;
        lang = sysLang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
    }

    // 主题逻辑
    let theme = params.get('theme');
    if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    // 应用配置
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.lang = lang;

    // 渲染国际化文本
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) {
            el.textContent = i18n[lang][key];
        }
    });

    // UA 默认值
    document.getElementById('user-agent').value = navigator.userAgent

    // DOM 元素引用 (加入了新增的输入框)
    const formInputs = [
        document.getElementById('method'),
        document.getElementById('url'),
        document.getElementById('user-agent'),
        document.getElementById('proxy'),
        document.getElementById('upload-file'),
        document.getElementById('output-file'),
        document.getElementById('body'),
        document.getElementById('flag-location'),
        document.getElementById('flag-insecure'),
        document.getElementById('flag-verbose'),
        document.getElementById('flag-silent'),
        document.getElementById('custom-options')
    ];
    const headersContainer = document.getElementById('headers-container');
    const outputEl = document.getElementById('output');

    // Bash 字符串转义逻辑
    function escapeShellArg(arg) {
        if (!arg) return "''";
        return `'${arg.replace(/'/g, "'\\''")}'`;
    }

    // Header 管理
    function addHeaderRow(key = '', value = '') {
        const row = document.createElement('div');
        row.className = 'header-row';
        row.innerHTML = `
            <input type="text" class="header-key flex-1" placeholder="${i18n[lang].headerKey}" value="${key}">
            <input type="text" class="header-value flex-1" placeholder="${i18n[lang].headerValue}" value="${value}">
            <button type="button" class="danger icon-btn remove-header" aria-label="Remove Header" title="Remove">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
        `;
        row.querySelector('.remove-header').addEventListener('click', () => {
            row.remove();
            generateCurl();
        });
        row.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', generateCurl);
        });
        headersContainer.appendChild(row);
        generateCurl();
    }

    document.getElementById('add-header-btn').addEventListener('click', () => addHeaderRow());

    // 生成命令逻辑
    function generateCurl() {
        const method = document.getElementById('method').value;
        const url = document.getElementById('url').value;
        const ua = document.getElementById('user-agent').value.trim();
        const proxy = document.getElementById('proxy').value.trim();
        const upload = document.getElementById('upload-file').value.trim();
        const output = document.getElementById('output-file').value.trim();
        const body = document.getElementById('body').value;
        const custom = document.getElementById('custom-options').value.trim();
        
        let cmd = ['curl'];

        // Method
        if (method !== 'GET') {
            cmd.push(`-X ${method}`);
        }

        // 新增的特化参数
        if (ua) cmd.push(`-A ${escapeShellArg(ua)}`);
        if (proxy) cmd.push(`-x ${escapeShellArg(proxy)}`);
        if (upload) cmd.push(`-T ${escapeShellArg(upload)}`);
        if (output) cmd.push(`-o ${escapeShellArg(output)}`);

        // Flags
        if (document.getElementById('flag-location').checked) cmd.push('-L');
        if (document.getElementById('flag-insecure').checked) cmd.push('-k');
        if (document.getElementById('flag-verbose').checked) cmd.push('-v');
        if (document.getElementById('flag-silent').checked) cmd.push('-s');

        // Headers
        document.querySelectorAll('.header-row').forEach(row => {
            const key = row.querySelector('.header-key').value.trim();
            const value = row.querySelector('.header-value').value.trim();
            if (key) {
                cmd.push(`-H ${escapeShellArg(`${key}: ${value}`)}`);
            }
        });

        // Body
        if (body && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
            cmd.push(`-d ${escapeShellArg(body)}`);
        }

        // Custom options
        if (custom) {
            cmd.push(custom);
        }

        // URL (放在最后)
        if (url) {
            cmd.push(escapeShellArg(url));
        } else {
            cmd.push("''");
        }

        // 格式化输出
        outputEl.textContent = cmd.join(' \\\n  ');
    }

    // 事件监听
    formInputs.forEach(input => {
        input.addEventListener('input', generateCurl);
        input.addEventListener('change', generateCurl);
    });

    // 复制功能
    document.getElementById('copy-btn').addEventListener('click', function() {
        const text = outputEl.textContent.replace(/ \\\n  /g, ' '); 
        navigator.clipboard.writeText(text).then(() => {
            const originalText = this.textContent;
            this.textContent = i18n[lang].copied;
            setTimeout(() => {
                this.textContent = originalText;
            }, 2000);
        });
    });

    // 初始化
    addHeaderRow('Content-Type', 'application/json');
    generateCurl();

    // 监听系统主题变化
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (!params.get('theme')) {
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
    });

</script>
</body>
</html>
