<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PDF Splitter</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
        }

        /* 浅色模式变量 */
        .theme-light {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --drop-bg: #f1f5f9;
            --drop-hover: #eef2ff;
            --log-bg: #0f172a;
            --log-text: #e2e8f0;
            --input-border: #ddd;
        }

        /* 深色模式变量 */
        .theme-dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --drop-bg: #334155;
            --drop-hover: #475569;
            --log-bg: #020617;
            --log-text: #cbd5e1;
            --input-border: #475569;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; color: var(--primary); font-size: 28px; }
        header p { color: var(--text-sub); margin-top: 8px; }

        .drop-zone {
            border: 2px dashed var(--text-sub);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            background: var(--drop-bg);
            cursor: pointer;
            margin-bottom: 25px;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--primary);
            background: var(--drop-hover);
        }
        .drop-zone p { margin: 0; font-size: 16px; color: var(--text-main); }
        .drop-zone b { color: var(--primary); }

        .settings {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 25px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        label { font-weight: 600; font-size: 14px; color: var(--text-sub); }
        input[type="number"] {
            padding: 12px;
            background: var(--drop-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            outline: none;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button:disabled { background: #94a3b8; cursor: not-allowed; }

        .log-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 30px; margin-bottom: 10px;
        }
        .log-container {
            background: var(--log-bg);
            color: var(--log-text);
            border-radius: 12px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }
        .log-line { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 4px 0; }
        .log-info { color: #38bdf8; }
        .log-success { color: #4ade80; }
        .log-warn { color: #fbbf24; }
        .log-meta { color: #f472b6; }
        #fileInput { display: none; }
    </style>
</head>
<body class="theme-light">

<div class="app-container">
    <div class="card">
        <header>
            <h1 id="t-title">PDF 智能拆分工具</h1>
            <p id="t-desc">纯浏览器本地处理，通过 PDFDict 重构保留书签映射</p>
        </header>

        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <p id="fileName">拖拽 PDF 文件至此 或 <b>点击上传</b></p>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <div class="settings">
            <div class="input-group">
                <label id="t-label-size">每部分拆分页数</label>
                <input type="number" id="chunkSize" value="100" min="1">
                <button id="startBtn" onclick="executeTask()">
                    <span id="t-btn-start">开始</span>
                </button>
            </div>
        </div>

        <div class="log-header">
            <label id="t-label-log">执行日志</label>
            <span id="progressLabel" style="font-size: 12px; color: var(--primary);"></span>
        </div>
        <div class="log-container" id="logBox"></div>
    </div>
</div>

<script>
    const { PDFDocument, PDFName, PDFHexString, PDFNumber, PDFDict, PDFArray } = PDFLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // --- 语言与主题配置 ---
    const i18n = {
        zh: {
            title: "PDF 智能拆分工具",
            desc: "纯浏览器本地处理，通过 PDFDict 重构保留书签映射",
            drop: "拖拽 PDF 文件至此 或 <b>点击上传</b>",
            selected: "已选择",
            labelSize: "每部分拆分页数",
            btnStart: "开始",
            labelLog: "执行日志",
            ready: "系统就绪，等待上传文件...",
            noFile: "请先上传 PDF",
            startFlow: "启动 PDF 任务流...",
            scanning: "正在扫描 PDF 逻辑结构 (Catalog / Outlines)...",
            parseDone: "解析完成。总书签节点数: ",
            analysis: "文档分析: 共 {total} 页，预计拆分为 {parts} 部分",
            genPart: "正在生成 Part {num}: 页码范围 [{start} - {end}]",
            copying: "正在复制对象数据...",
            injecting: "正在重组 PDFDict，检测到书签 {count} 个",
            noOutline: "当前范围内无书签数据。",
            saving: "正在进行序列化并下载...",
            done: "所有操作已成功执行。"
        },
        en: {
            title: "Advanced PDF Splitter",
            desc: "Local browser processing with PDFDict bookmark reconstruction",
            drop: "Drop PDF here or <b>Click to upload</b>",
            selected: "Selected",
            labelSize: "Pages per part",
            btnStart: "Start",
            labelLog: "Execution Log",
            ready: "System ready, waiting for file...",
            noFile: "Please upload a PDF first",
            startFlow: "Starting PDF task flow...",
            scanning: "Scanning PDF structure (Catalog / Outlines)...",
            parseDone: "Parse complete. Total bookmark nodes: ",
            analysis: "Analysis: {total} pages, {parts} parts total",
            genPart: "Generating Part {num}: Range [{start} - {end}]",
            copying: "Copying object data...",
            injecting: "Reconstructing PDFDict, {count} bookmarks found",
            noOutline: "No bookmarks in this range.",
            saving: "Serializing and downloading...",
            done: "All tasks completed successfully."
        }
    };

    // 初始化语言和主题
    const params = new URLSearchParams(window.location.search);
    let lang = params.get('language') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
    let theme = params.get('theme');

    // 自动检测主题
    if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    document.body.className = `theme-${theme}`;
    const t = i18n[lang] || i18n.en;

    // 填充静态文本
    document.getElementById('t-title').innerText = t.title;
    document.getElementById('t-desc').innerText = t.desc;
    document.getElementById('fileName').innerHTML = t.drop;
    document.getElementById('t-label-size').innerText = t.labelSize;
    document.getElementById('t-btn-start').innerText = t.btnStart;
    document.getElementById('t-label-log').innerText = t.labelLog;

    const logBox = document.getElementById('logBox');
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const startBtn = document.getElementById('startBtn');

    addLog(t.ready);

    // --- UI 逻辑 ---
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
        dropZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); });
    });
    dropZone.addEventListener('dragover', () => dropZone.classList.add('drag-over'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFileSelect(e.target.files[0]);
    });

    function handleFileSelect(file) {
        fileInput.files = createFileList(file); // 保持 input 引用
        document.getElementById('fileName').innerHTML = `${t.selected}: <b>${file.name}</b> (${(file.size/1024/1024).toFixed(2)} MB)`;
        addLog(`${t.selected}: ${file.name}`, 'info');
    }

    function createFileList(file) {
        const dt = new DataTransfer();
        dt.items.add(file);
        return dt.files;
    }

    function addLog(msg, type = 'debug') {
        const div = document.createElement('div');
        div.className = `log-line log-${type}`;
        const time = new Date().toLocaleTimeString([], { hour12: false });
        div.innerHTML = `<span style="opacity:0.5">[${time}]</span> ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // --- 核心业务逻辑 ---
    async function executeTask() {
        const file = fileInput.files[0];
        const chunkSize = parseInt(document.getElementById('chunkSize').value);
        if (!file) return alert(t.noFile);

        startBtn.disabled = true;
        logBox.innerHTML = '';
        addLog(t.startFlow, "info");

        try {
            const arrayBuffer = await file.arrayBuffer();
            addLog(t.scanning, "info");
            const pdfjsDoc = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
            const fullOutline = await getFullOutline(pdfjsDoc);
            addLog(`${t.parseDone}${countNodes(fullOutline)}`, "success");

            const srcDoc = await PDFDocument.load(arrayBuffer);
            const totalPages = srcDoc.getPageCount();
            const partsTotal = Math.ceil(totalPages / chunkSize);
            addLog(t.analysis.replace('{total}', totalPages).replace('{parts}', partsTotal), "meta");

            for (let i = 0; i < partsTotal; i++) {
                const startIdx = i * chunkSize;
                const endIdx = Math.min(startIdx + chunkSize, totalPages) - 1;
                const partName = `${file.name.replace('.pdf','')}_part${i+1}.pdf`;

                addLog(`-----------------------------------`, "debug");
                addLog(t.genPart.replace('{num}', i+1).replace('{start}', startIdx+1).replace('{end}', endIdx+1), "info");

                const newDoc = await PDFDocument.create();
                const pageIndices = Array.from({ length: endIdx - startIdx + 1 }, (_, k) => startIdx + k);
                
                addLog(t.copying, "debug");
                const copiedPages = await newDoc.copyPages(srcDoc, pageIndices);
                copiedPages.forEach(p => newDoc.addPage(p));

                const partOutline = filterAndOffsetOutline(fullOutline, startIdx, endIdx);
                if (partOutline.length > 0) {
                    addLog(t.injecting.replace('{count}', countNodes(partOutline)), "meta");
                    injectOutlines(newDoc, partOutline);
                } else {
                    addLog(t.noOutline, "debug");
                }

                addLog(t.saving, "debug");
                const pdfBytes = await newDoc.save();
                saveAs(pdfBytes, partName);
                
                document.getElementById('progressLabel').innerText = `${i+1} / ${partsTotal}`;
            }
            addLog(t.done, "success");
        } catch (err) {
            addLog(`Error: ${err.message}`, "warn");
        } finally {
            startBtn.disabled = false;
        }
    }

    // [保持原有的 injectOutlines, getFullOutline, filterAndOffsetOutline, countNodes, saveAs 函数不变...]
    function injectOutlines(pdfDoc, outlineData) {
        const context = pdfDoc.context;
        const pageRefs = pdfDoc.getPages().map(p => p.ref);
        const outlinesDict = context.obj({ Type: PDFName.of('Outlines'), Count: PDFNumber.of(countNodes(outlineData)) });
        const outlinesDictRef = context.register(outlinesDict);

        function createTree(items, parentRef) {
            let firstRef, lastRef, prevRef;
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const itemDict = context.obj({ Title: PDFHexString.fromText(item.title), Parent: parentRef });
                if (item.pageIdx >= 0 && item.pageIdx < pageRefs.length) {
                    const destArray = PDFArray.withContext(context);
                    destArray.push(pdfDoc.getPage(item.pageIdx).ref);
                    destArray.push(PDFName.of('XYZ'));
                    destArray.push(PDFNumber.of(0));
                    destArray.push(PDFNumber.of(pdfDoc.getPage(item.pageIdx).getSize().height));
                    destArray.push(PDFNumber.of(0));
                    itemDict.set(PDFName.of('Dest'), destArray);
                }
                const itemRef = context.register(itemDict);
                if (i === 0) firstRef = itemRef;
                lastRef = itemRef;
                if (prevRef) {
                    context.lookup(prevRef).set(PDFName.of('Next'), itemRef);
                    itemDict.set(PDFName.of('Prev'), prevRef);
                }
                if (item.children && item.children.length > 0) {
                    const childResult = createTree(item.children, itemRef);
                    itemDict.set(PDFName.of('First'), childResult.first);
                    itemDict.set(PDFName.of('Last'), childResult.last);
                    itemDict.set(PDFName.of('Count'), PDFNumber.of(countNodes(item.children)));
                }
                prevRef = itemRef;
            }
            return { first: firstRef, last: lastRef };
        }
        const rootTree = createTree(outlineData, outlinesDictRef);
        outlinesDict.set(PDFName.of('First'), rootTree.first);
        outlinesDict.set(PDFName.of('Last'), rootTree.last);
        pdfDoc.catalog.set(PDFName.of('Outlines'), outlinesDictRef);
    }

    async function getFullOutline(pdfjsDoc) {
        const outline = await pdfjsDoc.getOutline();
        if (!outline) return [];
        async function traverse(items) {
            const res = [];
            for (const item of items) {
                let pIdx = -1;
                try {
                    if (item.dest) {
                        const d = typeof item.dest === 'string' ? await pdfjsDoc.getDestination(item.dest) : item.dest;
                        pIdx = await pdfjsDoc.getPageIndex(d[0]);
                    }
                } catch(e) {}
                res.push({ title: item.title, pageIdx: pIdx, children: item.items ? await traverse(item.items) : [] });
            }
            return res;
        }
        return traverse(outline);
    }

    function filterAndOffsetOutline(items, start, end) {
        return items.map(item => ({
            ...item,
            originIdx: item.pageIdx,
            pageIdx: item.pageIdx - start,
            children: filterAndOffsetOutline(item.children, start, end)
        })).filter(item => (item.pageIdx >= 0 && item.pageIdx <= (end-start)) || item.children.length > 0);
    }

    function countNodes(items) {
        let count = items.length;
        items.forEach(i => count += countNodes(i.children));
        return count;
    }

    function saveAs(bytes, name) {
        const blob = new Blob([bytes], { type: "application/pdf" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
    }
</script>
</body>
</html>
